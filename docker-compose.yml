version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    # For local development, map the directory so changes reflect instantly
    volumes:
      - ./backend:/app
    environment:
      - ENV=production

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    # Serve static files instantly during local development
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
